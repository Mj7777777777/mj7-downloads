name: Fin de l'offre de lancement

# Le 15 novembre 2026, retire l'offre de lancement de la page : la Suite passe a 70 000 FCFA.
on:
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre la page au prix normal
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261115 ] || ! grep -q "Offre de lancement" README.md; then echo "Rien a faire."; exit 0; fi
          python3 - <<'PY'
          import re
          s = open("README.md", encoding="utf-8").read()
          s = re.sub(r"> \*\*🔥 Offre de lancement.*?\n", "> **Suite complète (les 7 plugins) : 70 000 FCFA**\n", s)
          open("README.md", "w", encoding="utf-8").write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Fin de l'offre de lancement : Suite a 70 000 FCFA"
          git push
