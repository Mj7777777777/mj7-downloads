name: Publier les installateurs

# Rassemble la derniere version de chaque plugin MJ7, fabrique les installateurs Windows et Mac,
# et les publie ici. Se lance tout seul toutes les 6 heures (seulement si un plugin a change),
# ou a la main : onglet Actions > Publier les installateurs > Run workflow. Depots des plugins : prives.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

env:
  # Jeton pour lire les depots prives des plugins (secret MJ7_TOKEN, lecture seule sur les 7 depots).
  GH_TOKEN: ${{ secrets.MJ7_TOKEN || github.token }}
  PLUGINS: mj7-vocal-chain mj7-master-chain mj7-voice-over mj7-backs-adlibs mj7-tune mj7-live-monitor mj7-vocal-booth

jobs:
  rassembler:
    name: Rassembler les plugins
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Telecharger la derniere version de chaque plugin
        run: |
          mkdir -p zips
          : > versions.txt
          for r in $PLUGINS; do
            tag=$(gh release view --repo "Mj7777777777/$r" --json tagName -q .tagName)
            gh release download "$tag" --repo "Mj7777777777/$r" -p '*.zip' -D zips --clobber
            base=$(gh release view "$tag" --repo "Mj7777777777/$r" --json assets -q '.assets[].name' | grep -- '-macOS.zip$' | sed 's/-macOS.zip$//')
            echo "$base ${tag#v}" >> versions.txt
          done
          cat versions.txt
          ls -la zips
      - name: Quelque chose a change ?
        id: check
        run: |
          now="Versions : $(tr '\n' ' ' < versions.txt | sed 's/ *$//')"
          echo "$now" > resume.txt
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && printf '%s' "$prev" | grep -qF "$now"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Aucun changement."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.changed == 'true'
        with:
          name: plugins
          path: |
            zips
            versions.txt
            resume.txt

  mac:
    name: Installateurs Mac
    needs: rassembler
    if: needs.rassembler.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugins
      - run: bash installateurs/mac/construire.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*.pkg

  windows:
    name: Installateurs Windows
    needs: rassembler
    if: needs.rassembler.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugins
      - shell: pwsh
        env:
          SUITE_VERSION: 1.0.${{ github.run_number }}
        run: ./installateurs/windows/construire.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe

  publier:
    name: Publier
    needs: [rassembler, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: a
      - name: Preparer
        run: |
          mkdir -p f
          find a -name '*.pkg' -exec cp {} f/ \;
          find a -name '*.exe' -exec cp {} f/ \;
          ls -la f
          {
            echo "Installateurs des plugins MJ7 pour Windows (.exe) et Mac (.pkg)."
            echo
            echo "Mode d'emploi et liens directs : https://github.com/$GITHUB_REPOSITORY#readme"
            echo
            cat a/plugins/resume.txt
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Plugins MJ7 - ${{ github.run_number }}
          body_path: notes.md
          make_latest: true
          files: f/*
